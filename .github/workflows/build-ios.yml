name: Build iOS IPA for Veeb-SE

on:
  workflow_dispatch:
  push:
    branches:
      - software-page-table-fallback

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: milkiaii/Veeb-SE
          ref: software-page-table-fallback
          submodules: recursive

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install Build Dependencies
        run: |
          brew install cmake ninja pkg-config

      - name: Configure CMake for iOS
        run: |
          mkdir build-ios
          cd build-ios
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build Project
        run: |
          cmake --build build-ios --config Release

      - name: Package into IPA
        run: |
          APP_PATH=$(find build-ios -name "*.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Veeb-SE-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veeb-SE-iOS-IPA
          path: Veeb-SE-iOS.ipa
