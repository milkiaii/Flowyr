name: Build Veeb-SE iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - software-page-table-fallback
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ios/**"
      - "vita3k/**"
      - "external/**"
      - ".ci/package-ios.sh"
      - ".github/workflows/build-ios.yml"
  pull_request:
    branches:
      - software-page-table-fallback
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "ios/**"
      - "vita3k/**"
      - "external/**"
      - ".ci/package-ios.sh"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: Veeb-SE arm64 device build
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Select Xcode toolchain
        run: |
          xcode_apps=(/Applications/Xcode_*.app)
          if [[ ! -d "${xcode_apps[0]}" ]]; then
            echo "::error::No Xcode installation is present on this macos-15 runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          selected_xcode="${xcode_apps[${#xcode_apps[@]}-1]}"
          echo "Selecting ${selected_xcode}"
          sudo xcode-select --switch "${selected_xcode}/Contents/Developer"
          xcode_ver="$(xcodebuild -version | head -1 | tr ' ' '-')"
          echo "XCODE_VER=${xcode_ver}" >> "$GITHUB_ENV"

      - name: Apply iOS submodule patches (if present)
        run: |
          if [ -f "${GITHUB_WORKSPACE}/ios/patches/0001-oaknut-ios-rwx-jit.patch" ]; then
            git -C external/dynarmic apply --verbose \
              "${GITHUB_WORKSPACE}/ios/patches/0001-oaknut-ios-rwx-jit.patch"
            git -C external/dynarmic diff --check
          else
            echo "No optional dynarmic patch found; skipping."
          fi

      - name: Show Apple toolchain info
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK ${sdk_version}"
          cmake --version

      - name: Bootstrap pinned vcpkg
        run: |
          mkdir -p build-deps
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git build-deps/vcpkg
          git -C build-deps/vcpkg checkout 77df67cfff9c12ccfdb52284e07c87c75092f723
          ./build-deps/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$PWD/build-deps/vcpkg" >> "$GITHUB_ENV"

      - name: Restore iOS vcpkg binary archive
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-arm64-ios-77df67c-${{ env.XCODE_VER }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-arm64-ios-77df67c-${{ env.XCODE_VER }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-arm64-ios-77df67c-${{ env.XCODE_VER }}-

      - name: Install pinned MoltenVK iOS package
        run: |
          mkdir -p build-deps/moltenvk
          curl --fail --location --retry 3 \
            --output build-deps/MoltenVK-ios.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.1/MoltenVK-ios.tar
          echo "54336b90212c390ed5935c96460aed3bf651ad7d3c0f0e956586ce18e9c0b701  build-deps/MoltenVK-ios.tar" \
            | shasum -a 256 --check
          tar -xf build-deps/MoltenVK-ios.tar -C build-deps/moltenvk
          MVK_ROOT="$PWD/build-deps/moltenvk/MoltenVK/MoltenVK"
          MVK_LIBRARY="$MVK_ROOT/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          test -f "$MVK_LIBRARY"
          test -f "$MVK_ROOT/include/MoltenVK/mvk_vulkan.h"
          echo "VITA3K_IOS_MOLTENVK_LIBRARY=$MVK_LIBRARY" >> "$GITHUB_ENV"
          echo "VITA3K_IOS_MOLTENVK_INCLUDE_DIR=$MVK_ROOT/include" >> "$GITHUB_ENV"
          file "$MVK_LIBRARY"

      - name: Configure Veeb-SE iOS application
        run: |
          cmake -S . -B build-ios-veeb -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DVITA3K_BUILD_IOS=ON \
            -DVITA3K_IOS_MOLTENVK_LIBRARY="$VITA3K_IOS_MOLTENVK_LIBRARY" \
            -DVITA3K_IOS_MOLTENVK_INCLUDE_DIR="$VITA3K_IOS_MOLTENVK_INCLUDE_DIR" \
            -DVITA3K_FORCE_SYSTEM_BOOST=ON \
            -DUSE_DISCORD_RICH_PRESENCE=OFF \
            -DUSE_VITA3K_UPDATE=OFF \
            -DUSE_LTO=NEVER

      - name: Save iOS vcpkg binary archive
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-arm64-ios-77df67c-${{ env.XCODE_VER }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Build unsigned Veeb-SE application
        run: |
          cmake --build build-ios-veeb \
            --config Release \
            --target Vita3KiOS \
            -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package and verify unsigned IPA
        run: |
          mkdir -p artifacts
          if [ -f ./.ci/package-ios.sh ]; then
            bash ./.ci/package-ios.sh \
              --build-dir build-ios-veeb \
              --configuration Release \
              --output artifacts/Veeb-SE-iOS-unsigned.ipa
          else
            cd build-ios-veeb/Release-iphoneos
            mkdir -p Payload
            mv Vita3KiOS.app Payload/
            zip -r ../../artifacts/Veeb-SE-iOS-unsigned.ipa Payload
          fi

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veeb-SE-iOS-${{ github.sha }}-unsigned
          path: artifacts/Veeb-SE-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
